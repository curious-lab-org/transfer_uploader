# PostgreSQL in every environment, including test.
#
# Development and test connect to the server started by `docker compose up -d`.
# Set DATABASE_URL to point somewhere else; Rails merges it over the settings below.
#
# Solid Queue, Cache and Cable share the primary database rather than having their own.
#
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("PGHOST") { "localhost" } %>
  port: <%= ENV.fetch("PGPORT") { 5432 } %>
  username: <%= ENV.fetch("PGUSER") { "postgres" } %>
  password: <%= ENV.fetch("PGPASSWORD") { "postgres" } %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: transfer_uploader_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: transfer_uploader_test

# Production is configured entirely from DATABASE_URL.
production:
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  url: <%= ENV["DATABASE_URL"] %>
